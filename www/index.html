  msg.className = 'small okt'; msg.textContent = t('dbOk', countsTxt(countsOf(D))) + (res.skip ? ' ' + t('dbSkipped', res.skip) : '');
  if (silent) toast(t('dbUpdated'));
  return true;
}
async function importFromUrl(u, silent) {
  const msg = $('#dbMsg'), url = driveUrl(u);
  if (!url) { if (!silent) { msg.className = 'small badt'; msg.textContent = u ? t('dbErrUrl') : t('dbNoUrl'); } return; }
  S.set.dbUrl = u.trim(); save(); renderSet();
  if (!silent) { msg.className = 'small'; msg.textContent = t('dbLoading'); }
  let src;
  try { src = await download(url); }
  catch (e) { if (!silent) { msg.className = 'small badt'; msg.textContent = e.browser ? t('dbErrBrowser') : t('dbErrNet', e.message || e); } return; }
  await importData(src, { url: S.set.dbUrl }, silent);
}

/* ================= events ================= */
$('#next').onclick = () => { if (answered) nextQ(); };
$('#quit').onclick = () => {
  if (!SS) return closePlay();
  if (SS.i <= 1 && !answered && !SS.ans) return closePlay();
  showModal('<h2>Kilépsz?</h2><p>Az eddig szerzett XP és tallér megmarad.</p>', [['Maradok', 'ghost'], ['Kilépek', 'post', () => endGame(false)]]);
};
document.addEventListener('keydown', e => {
  if ($('#modal').classList.contains('on') || !SS || !$('#play').classList.contains('on')) return;
  if (e.key === 'Enter' && answered) { e.preventDefault(); nextQ(); return; }
  if (Q && Q.kind === 'choice' && !answered && /^[1-4]$/.test(e.key)) { const b = document.querySelectorAll('.opt')[+e.key - 1]; if (b && !b.disabled) b.click(); }
  if (e.key === 'Escape') $('#quit').click();
});
function goTab(v) {
  document.querySelectorAll('.nav button').forEach(x => x.toggleAttribute('aria-current', x.dataset.v === v));
  document.querySelectorAll('.nav button[aria-current]').forEach(x => x.setAttribute('aria-current', 'page'));
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + v));
  renderAll(); scrollTopApp();
}
document.querySelectorAll('.nav button').forEach(b => b.onclick = () => goTab(b.dataset.v));
$('#selAll').onclick = () => { S.set.lessons = D.L.map(l => l.i); save(); refreshHome(); };
$('#selNone').onclick = () => { S.set.lessons = []; save(); refreshHome(); };
$('#sLen').onchange = e => { S.set.len = +e.target.value; save(); };
$('#sSound').onchange = e => { S.set.sound = e.target.value === '1'; save(); };
$('#sTheme').onchange = e => { S.set.theme = e.target.value; save(); applyTheme(); };
$('#sTimer').onchange = e => { S.set.timer = e.target.value; save(); };
$('#sAuto').onchange = e => { S.set.autoUpd = e.target.value === '1'; save(); };
$('#sLang').onchange = e => setLang(e.target.value);
$('#sPrev').onchange = e => { S.set.preview = e.target.value === '1'; save(); renderAll(); };
document.querySelectorAll('.seg button[data-lang]').forEach(b => b.onclick = () => setLang(b.dataset.lang));
document.querySelectorAll('#rng button').forEach(b => b.onclick = () => { STATRANGE = +b.dataset.r; applyI18n(); renderStats(); });
$('#fullBtn').onclick = () => { S.set.preview = false; save(); renderAll(); };
$('#dbImport').onclick = () => importFromUrl($('#dbUrl').value);
$('#dbRefresh').onclick = () => importFromUrl($('#dbUrl').value || S.set.dbUrl || (DBMETA && DBMETA.url) || '');
$('#dbFile').onchange = e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  $('#dbMsg').className = 'small'; $('#dbMsg').textContent = t('dbLoading');
  rd.onload = () => { importData({ type: 'array', data: new Uint8Array(rd.result) }, { file: f.name }); e.target.value = ''; };
  rd.onerror = () => { $('#dbMsg').className = 'small badt'; $('#dbMsg').textContent = t('dbErrParse', f.name); };
  rd.readAsArrayBuffer(f);
};
$('#dbReset').onclick = () => showModal(`<h2>${esc(t('dbReset'))}?</h2><p>${esc(countsTxt(countsOf(BUILTIN)))}</p>`, [[t('cancel'), 'ghost'], ['OK', 'post', async () => {
  D = BUILTIN; DBMETA = null; try { await IDB.del('customdb'); } catch (e) {}
  S.set.lessons = S.set.lessons.filter(i => D.L.some(l => l.i === i)); if (!S.set.lessons.length) S.set.lessons = ['L01'];
  save(); renderAll(); $('#dbMsg').className = 'small okt'; $('#dbMsg').textContent = t('dbResetDone');
}]]);
$('#reset').onclick = () => showModal(`<h2>${esc(t('resetQ'))}</h2><p>${esc(t('resetP'))}</p>`,
  [[t('cancel'), 'ghost'], [t('del'), 'post', () => { const keep = S.set; S = merge(null); S.set = keep; save(); renderAll(); toast(t('resetDone')); }]]);
const tick = () => { const d = new Date(); $('#clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
tick(); setInterval(tick, 30000);

/* Android hardware back button (Capacitor App plugin) */
if (isNative && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
  window.Capacitor.Plugins.App.addListener('backButton', () => {
    if ($('#modal').classList.contains('on')) { modalQueue.length = 0; nextModal(); return; }
    if ($('#play').classList.contains('on')) { $('#quit').click(); return; }
    const cur = document.querySelector('.nav button[aria-current]');
    if (cur && cur.dataset.v !== 'play') { goTab('play'); return; }
    window.Capacitor.Plugins.App.exitApp();
  });
}

/* ================= start ================= */
renderAll();
if (!S.savedAt) showModal(t('welcome'), [['Magyar menü', 'ghost', () => setLang('hu')], ['Deutsches Menü', 'post', () => setLang('de')]]);
(async () => {
  try {
    const c = await IDB.get('customdb');
    if (c && c.D && c.D.v && c.D.v.length) {
      D = c.D; DBMETA = c.meta || { at: Date.now() };
      S.set.lessons = S.set.lessons.filter(i => D.L.some(l => l.i === i)); if (!S.set.lessons.length) S.set.lessons = [D.L[0].i];
      renderAll();
    }
    if (isNative && S.set.autoUpd && (S.set.dbUrl || (DBMETA && DBMETA.url))) importFromUrl(S.set.dbUrl || DBMETA.url, true);
  } catch (e) {}
})();
/* optional cloud sync when running as a Claude artifact */
(async () => {
  try {
    if (isNative || !window.claude || typeof window.claude.use !== 'function') return;
    const db = await window.claude.use('db'), user = await window.claude.use('user');
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const doc = db.doc('data/users/' + id + '/progress');
    const snap = await doc.get();
    if (snap.exists) { const d = snap.data(); if (d && d.state && (d.state.savedAt || 0) > (S.savedAt || 0)) { S = merge(d.state); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} } }
    DBDOC = doc; if (S.savedAt) DBDOC.set({ state: JSON.parse(JSON.stringify(S)) }).catch(() => {});
    SYNC = 'cloud'; renderAll();
  } catch (e) { DBDOC = null; }
})();

</script>
</body>
</html>
